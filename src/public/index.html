<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streetwise Colombo — City Maintenance Map</title>
  <meta name="description" content="Live city maintenance map for Colombo. Report potholes, flooding, street light outages and more. Watch the city get fixed in real time." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #161921;
      --surface2:  #1e2230;
      --border:    #2a2f40;
      --text:      #e2e8f0;
      --muted:     #8892a4;
      --accent:    #00b4d8;
      --accent-dim:#00384a;
      --p1:#6b7280; --p2:#3b82f6; --p3:#f59e0b; --p4:#f97316; --p5:#ef4444;
      --font:'Inter',system-ui,sans-serif;
      --sidebar-w: 340px;
      --card-w:    360px;
      --topbar-h:  56px;
    }

    html, body { height:100%; width:100%; overflow:hidden; }
    body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; display:flex; flex-direction:column; }

    /* ── TOP BAR ── */
    #topbar {
      height: var(--topbar-h);
      display:flex; align-items:center; gap:12px; padding:0 16px;
      background:var(--surface); border-bottom:1px solid var(--border);
      z-index:20; flex-shrink:0; flex-wrap:wrap;
    }
    #topbar .logo { font-size:17px; font-weight:800; color:var(--accent); white-space:nowrap; flex-shrink:0; letter-spacing:-0.5px; }
    #topbar .logo span { color:var(--text); }

    .type-filters { display:flex; gap:5px; flex-wrap:wrap; flex:1; min-width:0; }
    .type-btn {
      padding:5px 12px; border-radius:20px; border:1px solid var(--border);
      background:transparent; color:var(--muted); font-size:12px; font-family:var(--font);
      cursor:pointer; transition:all 0.15s; white-space:nowrap;
    }
    .type-btn:hover  { border-color:var(--accent); color:var(--text); }
    .type-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:600; }

    #report-btn {
      padding:8px 18px; border-radius:8px; border:none; background:var(--accent);
      color:#0d0f14; font-weight:700; font-size:13px; font-family:var(--font);
      cursor:pointer; transition:all 0.15s; text-decoration:none; flex-shrink:0;
      display:flex; align-items:center; gap:6px;
    }
    #report-btn:hover { background:#0ccee4; transform:translateY(-1px); }

    /* ── MAIN LAYOUT ── */
    #main { display:flex; flex:1; min-height:0; position:relative; }
    #map-container { flex:1; position:relative; overflow:hidden; }
    #map { width:100%; height:100%; }

    /* ── SIDEBAR ── */
    #sidebar {
      width:var(--sidebar-w); background:var(--surface); border-left:1px solid var(--border);
      display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; z-index:10;
    }

    /* Stats */
    #stats-bar { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
    .stat-item { flex:1; padding:12px 10px; text-align:center; border-right:1px solid var(--border); }
    .stat-item:last-child { border-right:none; }
    .stat-num { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); }
    .stat-label { font-size:10px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.5px; line-height:1.2; }

    /* Report list */
    #report-list-header {
      padding:10px 16px 8px; font-size:11px; text-transform:uppercase;
      letter-spacing:0.8px; color:var(--muted); border-bottom:1px solid var(--border);
      flex-shrink:0; display:flex; justify-content:space-between; align-items:center;
    }
    #report-count { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:1px 8px; font-size:11px; color:var(--muted); }
    #report-list { flex:1; overflow-y:auto; }
    #report-list::-webkit-scrollbar { width:4px; }
    #report-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

    .report-item {
      padding:12px 14px; border-bottom:1px solid var(--border);
      cursor:pointer; transition:background 0.1s; display:flex; gap:10px; align-items:flex-start;
    }
    .report-item:hover { background:var(--surface2); }
    .report-item.active { background:var(--surface2); border-left:3px solid var(--accent); padding-left:11px; }

    .priority-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:5px; }
    .p1{background:var(--p1);} .p2{background:var(--p2);} .p3{background:var(--p3);} .p4{background:var(--p4);} .p5{background:var(--p5);}

    .report-item-body { flex:1; min-width:0; }
    .report-item-text { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; }
    .report-item-meta { font-size:11px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:600; letter-spacing:0.3px; }
    .badge-type                  { background:var(--surface2); border:1px solid var(--border); color:var(--muted); }
    .badge-status-published      { background:#064e3b; color:#6ee7b7; }
    .badge-status-in_progress    { background:#1e3a5f; color:#93c5fd; }
    .badge-status-fixed          { background:#1f2937; color:#9ca3af; }
    .badge-status-needs_review   { background:#3b2900; color:#fbbf24; }

    /* ── STATE MESSAGES ── */
    .state-msg { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; color:var(--muted); gap:10px; text-align:center; }
    .state-msg p { font-size:13px; }
    .skeleton { background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-item { padding:12px 14px; border-bottom:1px solid var(--border); display:flex; gap:10px; }
    .skel-dot  { width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:5px; }
    .skel-line { height:12px; border-radius:4px; }

    /* ── MAP OVERLAYS (z-index ≤ 10 so card/backdrop go above) ── */
    #zone-legend {
      position:absolute; bottom:48px; left:16px; background:var(--surface);
      border:1px solid var(--border); border-radius:10px; padding:10px 14px;
      font-size:12px; z-index:5; display:flex; flex-direction:column; gap:6px; pointer-events:none;
    }
    .legend-row { display:flex; align-items:center; gap:8px; }
    .legend-swatch { width:12px; height:12px; border-radius:3px; }

    #staff-link {
      position:absolute; bottom:16px; right:16px; font-size:11px; color:var(--muted);
      text-decoration:none; background:var(--surface); border:1px solid var(--border);
      padding:6px 12px; border-radius:8px; z-index:5; transition:color 0.15s;
    }
    #staff-link:hover { color:var(--accent); }

    #example-notice {
      position:absolute; top:12px; left:50%; transform:translateX(-50%);
      background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.35);
      color:#f59e0b; padding:5px 14px; border-radius:20px; font-size:11px;
      z-index:5; pointer-events:none; white-space:nowrap;
    }

    /* Zone popups */
    .maplibregl-popup-content {
      background:var(--surface) !important; color:var(--text) !important;
      border:1px solid var(--border) !important; border-radius:10px !important;
      padding:12px 14px !important; font-family:var(--font) !important; font-size:13px !important;
      box-shadow:0 8px 32px rgba(0,0,0,0.5) !important;
    }
    .maplibregl-popup-tip { display:none !important; }
    .zone-popup strong { display:block; margin-bottom:5px; font-size:14px; }
    .zone-paused { color:#f59e0b; font-size:12px; margin-top:3px; }
    .zone-active { color:#6ee7b7; font-size:12px; margin-top:3px; }

    /* ── BACKDROP ── */
    #card-backdrop {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
      z-index:50; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    }
    #card-backdrop.visible { display:block; animation:fade-in 0.2s ease; }
    @keyframes fade-in { from{opacity:0} to{opacity:1} }

    /* ── REPORT CARD ── */
    /* Slides in from the RIGHT (desktop) or BOTTOM (mobile). Sits above everything. */
    #report-card {
      position:fixed;
      top: var(--topbar-h);
      right:0;
      width: min(var(--card-w), 92vw);
      height: calc(100vh - var(--topbar-h));
      background:var(--surface);
      border-left:1px solid var(--border);
      border-top:1px solid var(--border);
      box-shadow:-24px 0 80px rgba(0,0,0,0.7);
      display:flex; flex-direction:column;
      z-index:60;
      transform:translateX(110%);
      transition:transform 0.34s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s ease;
      opacity:0;
      overflow:hidden;
    }
    #report-card.open { transform:translateX(0); opacity:1; }
    #report-card[aria-hidden="true"] { pointer-events:none; }

    .card-header {
      padding:16px 18px 14px;
      border-bottom:1px solid var(--border);
      border-left:4px solid transparent;
      display:flex; align-items:center; gap:12px; flex-shrink:0;
      background:linear-gradient(180deg, var(--surface), rgba(255,255,255,0.03));
    }
    .card-priority-badge {
      width:40px; height:40px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; font-size:19px; color:#fff; flex-shrink:0;
      box-shadow:0 0 0 3px rgba(255,255,255,0.1), 0 4px 14px rgba(0,0,0,0.35);
    }
    .card-header-info { flex:1; min-width:0; }
    .card-type-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.7px; margin-bottom:2px; }
    .card-title { font-size:15px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #close-card {
      background:var(--surface2); border:1px solid var(--border); border-radius:10px;
      color:var(--muted); width:36px; height:36px; cursor:pointer; font-size:15px;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
      transition:all 0.15s; font-family:var(--font); line-height:1;
    }
    #close-card:hover { background:rgba(239,68,68,0.15); border-color:rgba(239,68,68,0.45); color:#ef4444; transform:scale(1.05); }
    #close-card:active { transform:scale(0.95); }

    #card-body { flex:1; overflow-y:auto; padding:0; }
    #card-body::-webkit-scrollbar { width:5px; }
    #card-body::-webkit-scrollbar-track { background:transparent; }
    #card-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
    #card-body::-webkit-scrollbar-thumb:hover { background:var(--muted); }

    .card-section { padding:16px 18px; border-bottom:1px solid var(--border); }
    .card-section:last-child { border-bottom:none; }
    .card-section-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; font-weight:700; }
    .card-section.card-section-photo { padding:0; border-bottom:none; }

    .card-text { font-size:14px; line-height:1.7; color:var(--text); }

    .photo-wrap { position:relative; width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; overflow:hidden; aspect-ratio:16/9; }
    .photo-wrap.photo-broken { display:flex; align-items:center; justify-content:center; }
    .photo-wrap.photo-broken .card-photo { display:none; }
    .photo-wrap.photo-broken::after { content:'📷'; font-size:34px; color:var(--muted); }
    .card-photo { width:100%; height:100%; object-fit:cover; display:block; }

    .card-meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .card-meta-item { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 12px; }
    .card-meta-key   { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; font-weight:700; }
    .card-meta-val   { font-size:13px; font-weight:700; color:var(--text); }

    .status-chip {
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 12px; border-radius:22px; font-size:12px; font-weight:700;
      background:var(--surface2); color:var(--text); border:1px solid var(--border);
    }
    .status-published    { background:#064e3b; color:#6ee7b7; border:1px solid rgba(110,231,183,0.35); }
    .status-in_progress  { background:#1e3a5f; color:#93c5fd; border:1px solid rgba(147,197,253,0.35); }
    .status-fixed        { background:#1f2937; color:#9ca3af; border:1px solid rgba(156,163,175,0.35); }
    .status-needs_review { background:#3b2900; color:#fbbf24; border:1px solid rgba(251,191,36,0.35); }
    .status-rejected     { background:#450a0a; color:#fca5a5; border:1px solid rgba(254,165,165,0.35); }
    .status-merged       { background:#312e81; color:#c7d2fe; border:1px solid rgba(199,210,254,0.35); }

    .card-reason {
      font-size:12.5px; color:var(--muted); font-style:italic; line-height:1.6;
      background:var(--surface2); border:1px solid var(--border); border-radius:10px;
      padding:11px 13px;
    }
    .ai-chip {
      display:inline-flex; align-items:center; gap:6px; font-size:11px;
      color:var(--accent); background:var(--accent-dim); padding:5px 11px; border-radius:22px;
      font-weight:700; border:1px solid rgba(0,180,216,0.35);
    }

    /* Location row */
    .card-location {
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    .card-location span { font-size:12px; color:var(--muted); }
    .btn-link {
      background:transparent; border:1px solid var(--border); color:var(--accent);
      padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-family:var(--font);
      transition:all 0.15s;
    }
    .btn-link:hover { background:rgba(0,180,216,0.08); border-color:var(--accent); }

    /* Sticky action bar (sticks to bottom of the scrollable card body) */
    .card-actions-sticky {
      position:sticky; bottom:0;
      background:linear-gradient(180deg, transparent 55%, var(--surface));
      padding:14px 18px 24px; border-top:1px solid var(--border);
    }
    .card-actions-sticky a.card-cta {
      margin:0; padding:10px 14px; border-radius:10px; background:var(--accent-dim);
      border:1px solid var(--accent); color:var(--accent); text-align:center;
      font-size:13px; font-weight:700; text-decoration:none; display:block;
      transition:background 0.15s;
    }
    .card-actions-sticky a.card-cta:hover { background:rgba(0,180,216,0.18); }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 100%; --card-w: 100vw; }
      #main { flex-direction:column; }
      #sidebar { width:100%; max-height:260px; border-left:none; border-top:1px solid var(--border); }
      /* On mobile the card slides up from the bottom */
      #report-card {
        top:auto; bottom:0; right:0; left:0;
        width:100%; height:82vh;
        border-left:none; border-radius:20px 20px 0 0;
        border-top:1px solid var(--border); border-left:1px solid var(--border); border-right:1px solid var(--border);
        box-shadow:0 -24px 80px rgba(0,0,0,0.7);
        transform:translateY(110%);
        transition:transform 0.34s cubic-bezier(0.34,1.56,0.64,1), opacity 0.22s ease;
        opacity:0;
      }
      #report-card.open { transform:translateY(0); opacity:1; }
      .card-header { padding:14px 16px 12px; }
      .card-meta-grid { grid-template-columns:1fr 1fr 1fr; gap:8px; }
      .card-meta-item { padding:9px 10px; }
      .card-meta-key { font-size:9px; margin-bottom:4px; }
      .card-meta-val { font-size:11.5px; }
      .card-actions-sticky { padding:12px 16px 26px; }
      #zone-legend { display:none; }
    }
    @media (max-width:480px) {
      .type-filters { gap:4px; }
      .type-btn { padding:4px 9px; font-size:11px; }
      #report-btn { padding:7px 12px; font-size:12px; }
    }

    /* ── MAP PIN PULSE ── */
    @keyframes pulse-in { from{opacity:0; transform:scale(0.5)} to{opacity:1; transform:scale(1)} }
    .marker-new { animation:pulse-in 0.3s ease-out; }
  </style>
</head>
<body>

<!-- Top bar -->
<nav id="topbar" role="navigation" aria-label="Streetwise navigation">
  <div class="logo">Street<span>wise</span></div>

  <div class="type-filters" role="group" aria-label="Filter by report type">
    <button class="type-btn active" data-type="all" id="filter-all">All</button>
    <button class="type-btn" data-type="pothole" id="filter-pothole">🕳️ Pothole</button>
    <button class="type-btn" data-type="street_light" id="filter-street_light">💡 Light</button>
    <button class="type-btn" data-type="flooding" id="filter-flooding">🌊 Flood</button>
    <button class="type-btn" data-type="rubbish" id="filter-rubbish">🗑️ Rubbish</button>
  </div>

  <a href="/report" id="report-btn" aria-label="Submit a new maintenance report">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Report
  </a>
</nav>

<!-- Main layout -->
<main id="main">
  <div id="map-container">
    <div id="map" role="application" aria-label="Colombo city maintenance map"></div>

    <div id="example-notice" aria-live="polite">⚠️ Includes example data for demonstration</div>

    <!-- Zone legend -->
    <div id="zone-legend" aria-label="Map legend" role="img">
      <div class="legend-row"><div class="legend-swatch" style="background:rgba(0,180,216,0.2);border:1.5px solid rgba(0,180,216,0.5)"></div>Active zone</div>
      <div class="legend-row"><div class="legend-swatch" style="background:rgba(245,158,11,0.2);border:1.5px solid rgba(245,158,11,0.5)"></div>Paused zone</div>
    </div>

    <a href="/staff/login" id="staff-link">Staff sign in →</a>
  </div>

  <!-- Sidebar: stats + list -->
  <aside id="sidebar" aria-label="Report list and city statistics">
    <div id="stats-bar" role="region" aria-label="City statistics" aria-live="polite">
      <div class="stat-item">
        <div class="stat-num" id="stat-open">–</div>
        <div class="stat-label">Open reports</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat-fixed30">–</div>
        <div class="stat-label">Fixed this month</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="stat-total">–</div>
        <div class="stat-label">Fixed total</div>
      </div>
    </div>
    <div id="report-list-header">
      <span>Recent reports</span>
      <span id="report-count"></span>
    </div>
    <div id="report-list" role="list" aria-label="Public maintenance reports" aria-live="polite"></div>
  </aside>
</main>

<!-- Backdrop (closes card when clicking outside) -->
<div id="card-backdrop" aria-hidden="true"></div>

<!-- Report detail card — fixed panel, NOT inside map-container -->
<aside id="report-card" role="dialog" aria-modal="true" aria-label="Report details" aria-hidden="true">
  <div class="card-header">
    <div class="card-priority-badge" id="card-priority-badge" aria-label="Priority"></div>
    <div class="card-header-info">
      <div class="card-type-label" id="card-type-label">–</div>
      <div class="card-title" id="card-title">–</div>
    </div>
    <button id="close-card" aria-label="Close report details">✕</button>
  </div>
  <div id="card-body"></div>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let allReports    = [];
let allZones      = [];
let activeFilter  = 'all';
let activeReportId = null;
let $lastFocused = null;
const POLL_MS     = 30000;

const PRIORITY_COLORS = {
  1:'#6b7280', 2:'#3b82f6', 3:'#f59e0b', 4:'#f97316', 5:'#ef4444',
};
const PRIORITY_LABELS = {
  1:'Low', 2:'Medium', 3:'Elevated', 4:'High', 5:'Critical',
};
function pColor(p) { return PRIORITY_COLORS[p] || '#6b7280'; }

// ── Map ───────────────────────────────────────────────────────────────────────
const map = new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/dark',
  center:[79.878,6.906],
  zoom:12.6, minZoom:10, maxZoom:20,
  attributionControl:true,
});
map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'top-right');

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchReports() {
  const qs = activeFilter !== 'all' ? `?type=${activeFilter}` : '';
  const r = await fetch(`/api/reports${qs}`);
  if (!r.ok) throw new Error('Failed to load reports');
  return (await r.json()).reports;
}
async function fetchZones() {
  const r = await fetch('/api/zones');
  if (!r.ok) throw new Error('Failed to load zones');
  return (await r.json()).zones;
}
async function fetchStats() {
  const r = await fetch('/api/stats');
  if (!r.ok) return;
  const { totals } = await r.json();
  animCount('stat-open',    totals.open);
  animCount('stat-fixed30', totals.fixed_30d);
  animCount('stat-total',   totals.fixed_total);
}
function animCount(id, target) {
  const el = document.getElementById(id);
  const from = parseInt(el.textContent) || 0;
  const diff = target - from;
  if (!diff) return;
  let step = 0; const steps = 24;
  const t = setInterval(() => {
    step++;
    el.textContent = Math.round(from + diff * step / steps);
    if (step >= steps) { el.textContent = target; clearInterval(t); }
  }, 16);
}

// ── Map load ──────────────────────────────────────────────────────────────────
map.on('load', async () => {
  await loadZones();
  await loadReports();
  fetchStats();
  setInterval(() => { loadReports(); fetchStats(); }, POLL_MS);
});

// ── Zones ─────────────────────────────────────────────────────────────────────
async function loadZones() {
  try { allZones = await fetchZones(); renderZones(); }
  catch(e) { console.error('Zones error:', e); }
}
function renderZones() {
  const features = allZones.map(z => {
    const coords = JSON.parse(z.polygon);
    return {
      type:'Feature',
      properties:{ id:z.id, name:z.name, status:z.status, pause_reason:z.pause_reason, paused_until:z.paused_until, crew:z.crew },
      geometry:{ type:'Polygon', coordinates:[coords.map(([lng,lat]) => [lng,lat])] },
    };
  });
  const geojson = { type:'FeatureCollection', features };
  if (map.getSource('zones')) { map.getSource('zones').setData(geojson); return; }
  map.addSource('zones', { type:'geojson', data:geojson });
  map.addLayer({ id:'zones-fill', type:'fill', source:'zones',
    paint: { 'fill-color':['case',['==',['get','status'],'paused'],'rgba(245,158,11,0.07)','rgba(0,180,216,0.05)'], 'fill-opacity':1 }
  });
  map.addLayer({ id:'zones-outline', type:'line', source:'zones',
    paint: { 'line-color':['case',['==',['get','status'],'paused'],'rgba(245,158,11,0.45)','rgba(0,180,216,0.28)'], 'line-width':1.5, 'line-dasharray':[4,3] }
  });
  // Zone label layer
  map.addLayer({ id:'zones-label', type:'symbol', source:'zones',
    layout: { 'text-field':['get','name'], 'text-size':11, 'text-font':['Open Sans SemiBold','Arial Unicode MS Regular'], 'text-anchor':'center' },
    paint: { 'text-color':'rgba(255,255,255,0.35)', 'text-halo-color':'rgba(0,0,0,0.5)', 'text-halo-width':1 }
  });
  // Zone click popup
  map.on('click','zones-fill', e => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton:true, maxWidth:'260px', closeOnClick:true })
      .setLngLat(e.lngLat)
      .setHTML(`
        <div class="zone-popup">
          <strong>${p.name}</strong>
          ${p.status === 'paused'
            ? `<div class="zone-paused">⏸ Paused: ${p.pause_reason || 'No reason'}${p.paused_until ? ` · until ${p.paused_until}` : ''}</div>`
            : `<div class="zone-active">✓ Active${p.crew ? ` · ${p.crew}` : ''}</div>`}
        </div>`)
      .addTo(map);
  });
  map.on('mouseenter','zones-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave','zones-fill', () => { map.getCanvas().style.cursor = ''; });
}

// ── Reports ───────────────────────────────────────────────────────────────────
async function loadReports() {
  try {
    const fresh = await fetchReports();
    const existingIds = new Set(allReports.map(r => r.id));
    const newIds = fresh.filter(r => !existingIds.has(r.id)).map(r => r.id);
    allReports = fresh;
    renderSidebarList();
    renderMapPins(newIds);
    document.getElementById('report-count').textContent = allReports.length;
  } catch(e) {
    console.error('Reports error:', e);
    document.getElementById('report-list').innerHTML = `
      <div class="state-msg">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="currentColor"/></svg>
        <p>Couldn't load reports.<br>Pull to refresh or try again.</p>
      </div>`;
  }
}

function renderMapPins(newIds=[]) {
  const features = allReports.map(r => ({
    type:'Feature',
    properties:{ id:r.id, priority:r.priority, type:r.type, status:r.status },
    geometry:{ type:'Point', coordinates:[r.lng, r.lat] },
  }));
  const geojson = { type:'FeatureCollection', features };
  if (map.getSource('reports')) { map.getSource('reports').setData(geojson); return; }
  map.addSource('reports', { type:'geojson', data:geojson, cluster:true, clusterMaxZoom:14, clusterRadius:50 });

  // Cluster circles
  map.addLayer({ id:'clusters', type:'circle', source:'reports', filter:['has','point_count'],
    paint:{
      'circle-color':['step',['get','point_count'],'#3b82f6',5,'#f59e0b',10,'#ef4444'],
      'circle-radius':['step',['get','point_count'],18,5,24,10,30],
      'circle-opacity':0.85,
      'circle-stroke-width':2,
      'circle-stroke-color':'rgba(255,255,255,0.15)',
    }
  });
  map.addLayer({ id:'cluster-count', type:'symbol', source:'reports', filter:['has','point_count'],
    layout:{ 'text-field':'{point_count_abbreviated}', 'text-font':['Open Sans Bold','Arial Unicode MS Bold'], 'text-size':13 },
    paint:{ 'text-color':'#fff' }
  });

  // Individual pins — outer glow ring
  map.addLayer({ id:'report-glow', type:'circle', source:'reports', filter:['!',['has','point_count']],
    paint:{
      'circle-color':['match',['get','priority'],1,'#6b7280',2,'#3b82f6',3,'#f59e0b',4,'#f97316',5,'#ef4444','#6b7280'],
      'circle-radius':14, 'circle-opacity':0.15,
    }
  });
  // Individual pins — main circle
  map.addLayer({ id:'report-points', type:'circle', source:'reports', filter:['!',['has','point_count']],
    paint:{
      'circle-color':['match',['get','priority'],1,'#6b7280',2,'#3b82f6',3,'#f59e0b',4,'#f97316',5,'#ef4444','#6b7280'],
      'circle-radius':8,
      'circle-stroke-color':'rgba(255,255,255,0.5)',
      'circle-stroke-width':1.5,
    }
  });

  // Cluster expand
  map.on('click','clusters', e => {
    const f = map.queryRenderedFeatures(e.point, { layers:['clusters'] });
    map.getSource('reports').getClusterExpansionZoom(f[0].properties.cluster_id, (err, zoom) => {
      if (!err) map.easeTo({ center:f[0].geometry.coordinates, zoom });
    });
  });
  // Pin click → open card
  map.on('click','report-points', e => openCard(e.features[0].properties.id));

  map.on('mouseenter','clusters',      () => { map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave','clusters',      () => { map.getCanvas().style.cursor=''; });
  map.on('mouseenter','report-points', () => { map.getCanvas().style.cursor='pointer'; });
  map.on('mouseleave','report-points', () => { map.getCanvas().style.cursor=''; });
}

// ── Sidebar list ──────────────────────────────────────────────────────────────
function renderSidebarList() {
  const list = document.getElementById('report-list');
  if (!allReports.length) {
    list.innerHTML = `<div class="state-msg">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
      <p>No reports match the current filter.</p>
    </div>`;
    return;
  }
  list.innerHTML = allReports.slice(0,80).map(r => `
    <div class="report-item" role="listitem" data-id="${r.id}" tabindex="0"
         aria-label="${formatType(r.type)}, priority ${r.priority}: ${escHtml(r.text.slice(0,60))}">
      <div class="priority-dot p${r.priority}" aria-hidden="true"></div>
      <div class="report-item-body">
        <div class="report-item-text">${escHtml(r.text)}</div>
        <div class="report-item-meta">
          <span class="badge badge-type">${formatType(r.type)}</span>
          <span class="badge badge-status-${r.status}">${formatStatus(r.status)}</span>
          <span>${relTime(r.created_at)}</span>
        </div>
      </div>
    </div>`).join('');

  list.querySelectorAll('.report-item').forEach(el => {
    el.addEventListener('click', () => openCard(el.dataset.id));
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') openCard(el.dataset.id); });
  });
}

// ── Skeleton loader ───────────────────────────────────────────────────────────
function showSkeleton() {
  document.getElementById('report-list').innerHTML = Array.from({length:6}).map(() => `
    <div class="skel-item">
      <div class="skel-dot skeleton"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <div class="skel-line skeleton" style="width:85%;height:13px"></div>
        <div class="skel-line skeleton" style="width:55%;height:11px"></div>
      </div>
    </div>`).join('');
}

// ── Report card (fixed side-panel) ────────────────────────────────────────────
function openCard(id) {
  const r = allReports.find(x => x.id === id);
  if (!r) return;
  activeReportId = id;

  // Remember where focus was so we can return to it on close (accessibility)
  $lastFocused = document.activeElement;

  const col = pColor(r.priority);
  const badge = document.getElementById('card-priority-badge');
  const titleEl = document.getElementById('card-title');
  const typeEl  = document.getElementById('card-type-label');
  const header  = document.querySelector('.card-header');
  const card    = document.getElementById('report-card');
  const body    = document.getElementById('card-body');
  const back    = document.getElementById('card-backdrop');

  if (badge) {
    badge.textContent = r.priority;
    badge.style.background = col;
    badge.style.boxShadow  = `0 0 0 3px ${col}33, 0 4px 14px ${col}40`;
    badge.setAttribute('aria-label', `Priority ${r.priority} — ${PRIORITY_LABELS[r.priority]}`);
  }
  if (typeEl)  typeEl.textContent = formatType(r.type) + (r.size ? ` · ${r.size}` : '');
  if (titleEl) titleEl.textContent = r.text.slice(0,60) + (r.text.length > 60 ? '…' : '');
  if (header)  header.style.borderLeftColor = col;

  body.innerHTML = `
    <!-- Description -->
    <div class="card-section">
      <div class="card-section-label">Description</div>
      <p class="card-text">${escHtml(r.text)}</p>
    </div>

    <!-- Photo -->
    ${r.photo ? `<div class="card-section card-section-photo" style="padding:0">
      <div class="photo-wrap">
        <img class="card-photo" src="${escHtml(r.photo)}" alt="Report photo" loading="lazy"
             onerror="this.parentElement.classList.add('photo-broken')" />
      </div>
    </div>` : ''}

    <!-- Details -->
    <div class="card-section">
      <div class="card-section-label">Details</div>
      <div class="card-meta-grid">
        <div class="card-meta-item">
          <div class="card-meta-key">Status</div>
          <div class="card-meta-val">
            <span class="status-chip status-${r.status}">${statusDot(r.status)} ${formatStatus(r.status)}</span>
          </div>
        </div>
        <div class="card-meta-item">
          <div class="card-meta-key">Zone</div>
          <div class="card-meta-val">${escHtml(r.zone || '–')}</div>
        </div>
        <div class="card-meta-item">
          <div class="card-meta-key">Priority</div>
          <div class="card-meta-val" style="color:${col}">${r.priority} · ${PRIORITY_LABELS[r.priority]}</div>
        </div>
        <div class="card-meta-item">
          <div class="card-meta-key">Reported</div>
          <div class="card-meta-val">${relTime(r.created_at)}</div>
        </div>
      </div>
    </div>

    <!-- Location -->
    <div class="card-section">
      <div class="card-section-label">Location</div>
      <div class="card-location">
        <span style="color:var(--muted);font-size:12px">Pin on map · ${escHtml(formatType(r.type))}</span>
        <button class="btn-link" id="card-center-map" aria-label="Center map on this report">Center on map ↗</button>
      </div>
    </div>

    <!-- AI triage info -->
    ${r.reason ? `<div class="card-section">
      <div class="card-section-label">AI Assessment</div>
      <div class="card-reason">${escHtml(r.reason)}</div>
      <div style="margin-top:10px">
        <span class="ai-chip">${r.triaged_by === 'model' ? '🤖 AI classified' : '📋 Rule classified'}</span>
      </div>
    </div>` : ''}

    <!-- Actions -->
    <div class="card-actions-sticky">
      <a href="/report" class="card-cta">+ Report another problem near here</a>
    </div>
  `;

  // Open
  card.classList.add('open');
  card.setAttribute('aria-hidden','false');
  back.classList.add('visible');

  // Fly to report on map (defensive — throws if map isn't ready yet)
  try {
    map.flyTo({ center:[r.lng, r.lat], zoom:Math.max(map.getZoom(), 15), duration:700 });
  } catch(e) {
    console.warn('Map flyTo skipped:', e);
  }

  // Highlight in list
  document.querySelectorAll('.report-item').forEach(el => el.classList.toggle('active', el.dataset.id===id));

  // Focus close button for accessibility
  setTimeout(() => { const cb = document.getElementById('close-card'); if (cb) cb.focus(); }, 280);
}

function closeCard() {
  activeReportId = null;
  const card = document.getElementById('report-card');
  const back  = document.getElementById('card-backdrop');
  card.classList.remove('open');
  card.setAttribute('aria-hidden','true');
  back.classList.remove('visible');
  document.querySelectorAll('.report-item').forEach(el => el.classList.remove('active'));
  // Return focus to the element that opened the card
  if ($lastFocused && document.body.contains($lastFocused)) { $lastFocused.focus(); }
  $lastFocused = null;
}

document.getElementById('close-card').addEventListener('click', closeCard);
document.getElementById('card-backdrop').addEventListener('click', closeCard);
document.addEventListener('keydown', e => { if (e.key==='Escape' && activeReportId) closeCard(); });

// Center map on the currently open report (button is created dynamically → delegate)
document.addEventListener('click', e => {
  const btn = e.target.closest('#card-center-map');
  if (!btn || !activeReportId) return;
  const r = allReports.find(x => x.id === activeReportId);
  if (!r) return;
  try {
    map.flyTo({ center:[r.lng, r.lat], zoom:Math.max(map.getZoom(), 16), duration:600 });
  } catch(err) { console.warn('Map flyTo skipped:', err); }
});

// ── Filters ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.type;
    if (activeReportId) closeCard();
    showSkeleton();
    await loadReports();
  });
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatType(t) {
  return { pothole:'Pothole', street_light:'Street light', flooding:'Flooding', rubbish:'Rubbish', not_relevant:'Not relevant' }[t] || t;
}
function formatStatus(s) {
  return { published:'Open', in_progress:'In progress', fixed:'Fixed', received:'Received', needs_review:'Under review', rejected:'Rejected', merged:'Merged' }[s] || s;
}
function statusDot(s) {
  return { published:'●', in_progress:'◌', fixed:'✓', needs_review:'◈' }[s] || '·';
}
function relTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h/24);
  if (d < 30) return `${d}d ago`;
  return `${Math.floor(d/30)}mo ago`;
}

// Initial skeleton while map loads
showSkeleton();
</script>
