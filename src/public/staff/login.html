<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Sign In — Streetwise</title>
  <meta name="description" content="Staff sign in for Streetwise city maintenance platform." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14; --surface: #161921; --surface2: #1e2230; --border: #2a2f40;
      --text: #e2e8f0; --muted: #8892a4; --accent: #00b4d8; --error: #ef4444;
      --font: 'Inter', system-ui, sans-serif;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #card {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px;
    }
    #logo { font-size: 22px; font-weight: 800; color: #00b4d8; margin-bottom: 4px; }
    #logo span { color: var(--text); }
    #subtitle { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    input[type=email], input[type=password] {
      width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-family: var(--font); font-size: 14px;
      margin-bottom: 16px; transition: border 0.15s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    #error-msg {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      color: var(--error); padding: 10px 14px; border-radius: 8px; font-size: 13px;
      margin-bottom: 16px; display: none;
    }
    #error-msg.visible { display: block; }
    button[type=submit] {
      width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent);
      color: #fff; font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.15s;
    }
    button[type=submit]:hover { background: #0096b7; }
    button[type=submit]:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    #back-link { display: block; text-align: center; margin-top: 18px; font-size: 13px; color: var(--muted); text-decoration: none; }
    #back-link:hover { color: var(--accent); }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="card">
    <div id="logo">Street<span>wise</span></div>
    <div id="subtitle">Staff &amp; Admin Portal</div>

    <form id="login-form" novalidate>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" aria-required="true" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required aria-required="true" />

      <div id="error-msg" role="alert"></div>

      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <a href="/" id="back-link">← Back to public map</a>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      errEl.classList.remove('visible');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in…';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res  = await fetch('/api/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Invalid email or password.';
          errEl.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }

        // Redirect based on role
        window.location.href = '/staff/queue';
      } catch {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
