<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Report — Streetwise Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0f14;--surface:#161921;--surface2:#1e2230;--border:#2a2f40;
      --text:#e2e8f0;--muted:#8892a4;--accent:#00b4d8;--accent-dim:#005f73;
      --p1:#6b7280;--p2:#3b82f6;--p3:#f59e0b;--p4:#f97316;--p5:#ef4444;
      --success:#10b981;--error:#ef4444;--font:'Inter',system-ui,sans-serif;
    }
    body { background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh; }

    /* Reuse sidebar nav styles */
    #layout { display:flex; min-height:100vh; }
    #sidenav { width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0; }
    #sidenav .logo { font-size:18px;font-weight:800;color:var(--accent);padding:0 20px 20px;border-bottom:1px solid var(--border); }
    #sidenav .logo span { color:var(--text); }
    .nav-section { padding:16px 20px 8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px; }
    .nav-link { display:flex;align-items:center;gap:10px;padding:9px 20px;text-decoration:none;color:var(--muted);font-size:13px;transition:all 0.15s;border-left:3px solid transparent; }
    .nav-link:hover { color:var(--text);background:var(--surface2); }
    .nav-link.active { color:var(--accent);border-left-color:var(--accent);background:var(--accent-dim); }
    .nav-bottom { margin-top:auto;padding:16px 20px;border-top:1px solid var(--border); }
    #logout-btn { width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:none;color:var(--muted);font-family:var(--font);cursor:pointer;font-size:13px; }
    #logout-btn:hover { color:var(--text);border-color:var(--text); }

    #content { flex:1;padding:28px;overflow-y:auto;max-width:900px; }
    #breadcrumb { font-size:12px;color:var(--muted);margin-bottom:16px; }
    #breadcrumb a { color:var(--accent);text-decoration:none; }

    /* Report header */
    #rpt-header { display:flex;align-items:flex-start;gap:16px;margin-bottom:24px; }
    .pri-big { width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;flex-shrink:0; }
    #rpt-title { font-size:20px;font-weight:700;flex:1; }
    #rpt-id { font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums; }

    /* Two-col layout */
    #two-col { display:grid;grid-template-columns:1fr 320px;gap:20px;margin-bottom:24px; }

    /* Info card */
    .info-card { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px; }
    .info-card h3 { font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:14px; }
    .info-row { display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border); }
    .info-row:last-child { border-bottom:none; }
    .info-label { font-size:12px;color:var(--muted); }
    .info-val { font-size:13px;font-weight:500; }

    #mini-map { width:100%;height:180px;border-radius:10px;overflow:hidden;border:1px solid var(--border);margin-top:12px; }
    #report-photo { width:100%;border-radius:10px;margin-top:12px;display:none; }

    /* AI decision */
    .ai-panel { background:var(--accent-dim);border:1px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:16px; }
    .ai-label { font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px; }
    .ai-reason { font-size:13px;color:var(--text);line-height:1.5; }
    .ai-confidence { font-size:12px;color:var(--muted);margin-top:6px; }

    /* Duplicates */
    .dup-item { padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:background 0.1s; }
    .dup-item:hover { background:var(--surface2); }
    .dup-text { font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .dup-meta { font-size:11px;color:var(--muted);margin-top:3px; }

    /* Actions */
    #actions-card { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px; }
    #actions-card h3 { font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:14px; }

    .action-group { display:flex;flex-direction:column;gap:10px; }

    .btn { width:100%;padding:10px 16px;border-radius:8px;border:none;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:left; }
    .btn-approve  { background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3); }
    .btn-approve:hover  { background:rgba(16,185,129,0.25); }
    .btn-reject   { background:rgba(239,68,68,0.12);color:#ef4444;border:1px solid rgba(239,68,68,0.3); }
    .btn-reject:hover   { background:rgba(239,68,68,0.2); }
    .btn-progress { background:rgba(59,130,246,0.12);color:#3b82f6;border:1px solid rgba(59,130,246,0.3); }
    .btn-progress:hover { background:rgba(59,130,246,0.2); }
    .btn-fixed    { background:rgba(107,114,128,0.12);color:#9ca3af;border:1px solid rgba(107,114,128,0.3); }
    .btn-fixed:hover    { background:rgba(107,114,128,0.2); }

    .divider { border:none;border-top:1px solid var(--border);margin:12px 0; }

    select, input[type=text], textarea.sm {
      width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);
      background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px;margin-bottom:8px;
    }
    select:focus,input:focus,textarea.sm:focus { outline:none;border-color:var(--accent); }
    .btn-action { padding:8px 16px;border-radius:7px;border:none;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff; }
    .btn-action:hover { background:#0096b7; }

    label.sm { font-size:11px;color:var(--muted);margin-bottom:4px;display:block; }

    /* Toast */
    #toast { position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;transition:transform 0.25s;z-index:999; }
    #toast.show { transform:translateX(-50%) translateY(0); }
    #toast.ok { border-color:var(--success);color:var(--success); }
    #toast.err { border-color:var(--error);color:var(--error); }

    /* Loading */
    .state-msg { padding:60px;text-align:center;color:var(--muted); }

    @media(max-width:900px) { #sidenav{display:none;} #two-col{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div id="layout">
  <nav id="sidenav" aria-label="Staff navigation">
    <div class="logo">Street<span>wise</span></div>
    <div class="nav-section">Work</div>
    <a href="/staff/queue"    class="nav-link active">📋 Review queue</a>
    <div class="nav-section">Admin</div>
    <a href="/staff/zones"    class="nav-link">🗺️ Zones</a>
    <a href="/staff/settings" class="nav-link">⚙️ Settings</a>
    <a href="/staff/audit"    class="nav-link">📜 Audit log</a>
    <div class="nav-section">Public</div>
    <a href="/" class="nav-link">🌍 Public map</a>
    <div class="nav-bottom">
      <button id="logout-btn">Sign out</button>
    </div>
  </nav>

  <main id="content">
    <div id="breadcrumb"><a href="/staff/queue">← Queue</a></div>
    <div id="loading-state" class="state-msg" aria-live="polite">Loading report…</div>
    <div id="report-view" style="display:none">

      <div id="rpt-header">
        <div id="pri-badge" class="pri-big"></div>
        <div>
          <div id="rpt-title">–</div>
          <div id="rpt-id">–</div>
        </div>
      </div>

      <div class="ai-panel" role="note">
        <div class="ai-label">🤖 AI / Rules Decision</div>
        <div class="ai-reason" id="ai-reason">–</div>
        <div class="ai-confidence" id="ai-confidence">–</div>
      </div>

      <div id="two-col">
        <!-- Left: details + map -->
        <div>
          <div class="info-card" style="margin-bottom:16px">
            <h3>Report details</h3>
            <div class="info-row"><span class="info-label">Status</span><span class="info-val" id="d-status">–</span></div>
            <div class="info-row"><span class="info-label">Type</span><span class="info-val" id="d-type">–</span></div>
            <div class="info-row"><span class="info-label">Size</span><span class="info-val" id="d-size">–</span></div>
            <div class="info-row"><span class="info-label">Priority</span><span class="info-val" id="d-priority">–</span></div>
            <div class="info-row"><span class="info-label">Zone</span><span class="info-val" id="d-zone">–</span></div>
            <div class="info-row"><span class="info-label">Confidence</span><span class="info-val" id="d-confidence">–</span></div>
            <div class="info-row"><span class="info-label">Submitted</span><span class="info-val" id="d-created">–</span></div>
          </div>

          <div class="info-card">
            <h3>Description</h3>
            <p id="d-text" style="font-size:14px;line-height:1.6;margin-bottom:8px"></p>
            <img id="report-photo" alt="Report photo" />
            <div id="mini-map" role="application" aria-label="Report location on map"></div>
          </div>

          <!-- Possible duplicates -->
          <div id="dup-section" class="info-card" style="margin-top:16px;display:none">
            <h3>⚠️ Possible duplicates nearby</h3>
            <div id="dup-list"></div>
          </div>
        </div>

        <!-- Right: actions -->
        <div id="actions-card">
          <h3>Actions</h3>
          <div class="action-group">

            <button class="btn btn-approve" id="btn-approve">✓ Approve &amp; publish</button>
            <button class="btn btn-reject"  id="btn-reject-open">✗ Reject…</button>

            <div id="reject-form" style="display:none">
              <label class="sm" for="reject-reason">Reason for rejection</label>
              <textarea class="sm" id="reject-reason" rows="2" placeholder="e.g. Not a city maintenance issue."></textarea>
              <button class="btn-action" id="btn-reject-confirm">Confirm rejection</button>
            </div>

            <hr class="divider" />

            <div>
              <label class="sm" for="edit-type">Edit type</label>
              <select id="edit-type">
                <option value="">— keep current —</option>
                <option value="pothole">Pothole</option>
                <option value="street_light">Street light</option>
                <option value="flooding">Flooding</option>
                <option value="rubbish">Rubbish</option>
                <option value="not_relevant">Not relevant</option>
              </select>

              <label class="sm" for="edit-priority">Edit priority</label>
              <select id="edit-priority">
                <option value="">— keep current —</option>
                <option value="1">P1 — Cosmetic</option>
                <option value="2">P2 — Minor</option>
                <option value="3">P3 — This week</option>
                <option value="4">P4 — Likely injury</option>
                <option value="5">P5 — Danger now</option>
              </select>

              <button class="btn-action" id="btn-edit-save">Save changes</button>
            </div>

            <hr class="divider" />

            <div>
              <label class="sm" for="merge-id">Merge into report ID</label>
              <input type="text" id="merge-id" placeholder="e.g. r-abc123" />
              <button class="btn-action" id="btn-merge">Merge</button>
            </div>

            <hr class="divider" />

            <button class="btn btn-progress" id="btn-inprogress">🔧 Mark in progress</button>
            <button class="btn btn-fixed"    id="btn-fixed">✅ Mark fixed</button>

          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast" role="alert" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const params   = new URLSearchParams(location.search);
const reportId = params.get('id');
let miniMap    = null;
let report     = null;

const PRIORITY_COLORS = {1:'#6b7280',2:'#3b82f6',3:'#f59e0b',4:'#f97316',5:'#ef4444'};
const TYPE_LABELS = {pothole:'Pothole',street_light:'Street light',flooding:'Flooding',rubbish:'Rubbish',not_relevant:'Not relevant'};
const STATUS_LABELS = {received:'Received',needs_review:'Needs review',published:'Published',in_progress:'In progress',fixed:'Fixed',rejected:'Rejected',merged:'Merged'};

function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `show ${type}`;
  setTimeout(() => { t.className = ''; }, 3000);
}

async function load() {
  if (!reportId) { window.location.href = '/staff/queue'; return; }
  try {
    const res = await fetch(`/api/staff/reports/${reportId}`, { credentials: 'include' });
    if (res.status === 401) { window.location.href = '/staff/login'; return; }
    if (!res.ok) { document.getElementById('loading-state').textContent = 'Report not found.'; return; }
    const data = await res.json();
    report = data.report;
    render(data);
  } catch {
    document.getElementById('loading-state').textContent = 'Failed to load report.';
  }
}

function render({ report: r, events, duplicates }) {
  document.getElementById('loading-state').style.display = 'none';
  document.getElementById('report-view').style.display   = 'block';

  const color = PRIORITY_COLORS[r.priority] || '#6b7280';
  const priBadge = document.getElementById('pri-badge');
  priBadge.textContent = r.priority;
  priBadge.style.background = color;

  document.getElementById('rpt-title').textContent = TYPE_LABELS[r.type] || r.type;
  document.getElementById('rpt-id').textContent    = r.id;

  document.getElementById('ai-reason').textContent     = r.reason || '–';
  document.getElementById('ai-confidence').textContent = r.triaged_by === 'model'
    ? `🤖 AI model · confidence ${Math.round((r.confidence || 0) * 100)}%`
    : `📋 Keyword rules · confidence ${Math.round((r.confidence || 0) * 100)}%`;

  document.getElementById('d-status').textContent     = STATUS_LABELS[r.status] || r.status;
  document.getElementById('d-type').textContent       = TYPE_LABELS[r.type]  || r.type;
  document.getElementById('d-size').textContent       = r.size || '–';
  document.getElementById('d-priority').textContent   = `P${r.priority}`;
  document.getElementById('d-zone').textContent       = r.zone || '–';
  document.getElementById('d-confidence').textContent = r.confidence != null ? `${Math.round(r.confidence * 100)}%` : '–';
  document.getElementById('d-created').textContent    = new Date(r.created_at).toLocaleString('en-GB');
  document.getElementById('d-text').textContent       = r.text;

  if (r.photo) {
    const img = document.getElementById('report-photo');
    img.src = r.photo;
    img.style.display = 'block';
  }

  // Mini map
  miniMap = new maplibregl.Map({
    container: 'mini-map',
    style: 'https://tiles.openfreemap.org/styles/dark',
    center: [r.lng, r.lat],
    zoom: 15,
    interactive: false,
    attributionControl: false,
  });
  miniMap.on('load', () => {
    new maplibregl.Marker({ color }).setLngLat([r.lng, r.lat]).addTo(miniMap);
  });

  // Duplicates
  if (duplicates && duplicates.length > 0) {
    document.getElementById('dup-section').style.display = 'block';
    document.getElementById('dup-list').innerHTML = duplicates.map(d =>
      `<div class="dup-item" onclick="window.open('/staff/review?id=${d.id}','_blank')">
        <div class="dup-text">${escHtml(d.text)}</div>
        <div class="dup-meta">${TYPE_LABELS[d.type]||d.type} · ${STATUS_LABELS[d.status]||d.status}</div>
      </div>`
    ).join('');
  }
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function doAction(path, body, successMsg) {
  const res = await fetch(path, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const d = await res.json();
    toast(d.error || 'Action failed.', 'err');
    return false;
  }
  toast(successMsg);
  setTimeout(() => window.location.href = '/staff/queue', 1200);
  return true;
}

document.getElementById('btn-approve').addEventListener('click', () =>
  doAction(`/api/staff/reports/${reportId}/approve`, null, '✓ Approved and published.'));

document.getElementById('btn-reject-open').addEventListener('click', () => {
  const f = document.getElementById('reject-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('btn-reject-confirm').addEventListener('click', () => {
  const reason = document.getElementById('reject-reason').value.trim();
  doAction(`/api/staff/reports/${reportId}/reject`, { reason }, '✗ Rejected.');
});

document.getElementById('btn-edit-save').addEventListener('click', async () => {
  const type     = document.getElementById('edit-type').value;
  const priority = document.getElementById('edit-priority').value;
  const body     = {};
  if (type)     body.type     = type;
  if (priority) body.priority = Number(priority);
  if (!Object.keys(body).length) { toast('No changes selected.', 'err'); return; }
  const res = await fetch(`/api/staff/reports/${reportId}`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.ok) { toast('✓ Changes saved.'); setTimeout(() => load(), 800); }
  else { toast('Save failed.', 'err'); }
});

document.getElementById('btn-merge').addEventListener('click', () => {
  const into = document.getElementById('merge-id').value.trim();
  if (!into) { toast('Enter a report ID to merge into.', 'err'); return; }
  doAction(`/api/staff/reports/${reportId}/merge`, { into }, '🔗 Merged.');
});

document.getElementById('btn-inprogress').addEventListener('click', async () => {
  const res = await fetch(`/api/staff/reports/${reportId}`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'in_progress' }),
  });
  if (res.ok) { toast('🔧 Marked in progress.'); setTimeout(() => window.location.href = '/staff/queue', 1200); }
  else toast('Failed.', 'err');
});

document.getElementById('btn-fixed').addEventListener('click', async () => {
  const res = await fetch(`/api/staff/reports/${reportId}`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'fixed' }),
  });
  if (res.ok) { toast('✅ Marked fixed!'); setTimeout(() => window.location.href = '/staff/queue', 1200); }
  else toast('Failed.', 'err');
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/staff/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/staff/login';
});

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

load();
</script>
</body>
</html>
