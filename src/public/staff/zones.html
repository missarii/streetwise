<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zones — Streetwise Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0f14;--surface:#161921;--surface2:#1e2230;--border:#2a2f40;
      --text:#e2e8f0;--muted:#8892a4;--accent:#00b4d8;--accent-dim:#005f73;
      --font:'Inter',system-ui,sans-serif;
    }
    body { background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px; }
    #layout { display:flex;min-height:100vh; }
    #sidenav { width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;flex-shrink:0; }
    #sidenav .logo { font-size:18px;font-weight:800;color:var(--accent);padding:0 20px 20px;border-bottom:1px solid var(--border); }
    #sidenav .logo span { color:var(--text); }
    .nav-section { padding:16px 20px 8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px; }
    .nav-link { display:flex;align-items:center;gap:10px;padding:9px 20px;text-decoration:none;color:var(--muted);font-size:13px;transition:all 0.15s;border-left:3px solid transparent; }
    .nav-link:hover { color:var(--text);background:var(--surface2); }
    .nav-link.active { color:var(--accent);border-left-color:var(--accent);background:var(--accent-dim); }
    .nav-bottom { margin-top:auto;padding:16px 20px;border-top:1px solid var(--border); }
    #logout-btn { width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:none;color:var(--muted);font-family:var(--font);cursor:pointer;font-size:13px; }
    #logout-btn:hover { color:var(--text); }

    #content { flex:1;padding:28px;overflow-y:auto; }
    #page-header { margin-bottom:24px; }
    #page-header h1 { font-size:22px;font-weight:800; }
    #page-header p { color:var(--muted);font-size:13px;margin-top:4px; }

    .zones-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px; }
    .zone-card { background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;transition:border-color 0.15s; }
    .zone-card.paused { border-color:rgba(245,158,11,0.4); }
    .zone-card-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:14px; }
    .zone-name { font-size:16px;font-weight:700; }
    .zone-crew { font-size:12px;color:var(--muted);margin-top:2px; }
    .status-pill { padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600; }
    .pill-active { background:rgba(16,185,129,0.15);color:#10b981; }
    .pill-paused { background:rgba(245,158,11,0.15);color:#f59e0b; }

    .zone-stats { display:flex;gap:16px;margin-bottom:14px; }
    .zone-stat { text-align:center; }
    .zone-stat .num { font-size:20px;font-weight:800;color:var(--accent); }
    .zone-stat .lbl { font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px; }

    .pause-info { background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:#f59e0b; }

    /* Inline edit form */
    .zone-actions { display:flex;flex-direction:column;gap:8px; }
    label.sm { font-size:11px;color:var(--muted);display:block;margin-bottom:3px; }
    input.sm, textarea.sm { width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13px; }
    .btn-row { display:flex;gap:8px;margin-top:4px; }
    .btn-pause { padding:8px 14px;border-radius:7px;border:1px solid rgba(245,158,11,0.4);background:rgba(245,158,11,0.1);color:#f59e0b;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:background 0.15s; }
    .btn-pause:hover { background:rgba(245,158,11,0.2); }
    .btn-unpause { padding:8px 14px;border-radius:7px;border:1px solid rgba(16,185,129,0.4);background:rgba(16,185,129,0.1);color:#10b981;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:background 0.15s; }
    .btn-unpause:hover { background:rgba(16,185,129,0.2); }

    .state-msg { padding:60px;text-align:center;color:var(--muted); }
    #toast { position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;transition:transform 0.25s;z-index:999; }
    #toast.show { transform:translateX(-50%) translateY(0); }
    #toast.ok { border-color:#10b981;color:#10b981; }
    #toast.err { border-color:#ef4444;color:#ef4444; }
    @media(max-width:900px){ #sidenav{display:none;} }
  </style>
</head>
<body>
<div id="layout">
  <nav id="sidenav" aria-label="Staff navigation">
    <div class="logo">Street<span>wise</span></div>
    <div class="nav-section">Work</div>
    <a href="/staff/queue"    class="nav-link">📋 Review queue</a>
    <div class="nav-section">Admin</div>
    <a href="/staff/zones"    class="nav-link active">🗺️ Zones</a>
    <a href="/staff/settings" class="nav-link">⚙️ Settings</a>
    <a href="/staff/audit"    class="nav-link">📜 Audit log</a>
    <div class="nav-section">Public</div>
    <a href="/" class="nav-link">🌍 Public map</a>
    <div class="nav-bottom">
      <button id="logout-btn">Sign out</button>
    </div>
  </nav>
  <main id="content">
    <div id="page-header">
      <h1>Zones</h1>
      <p>Manage the 6 maintenance zones of Colombo. Pause a zone to notify the public and redirect reports.</p>
    </div>
    <div id="zones-grid" class="zones-grid">
      <div class="state-msg">Loading zones…</div>
    </div>
  </main>
</div>
<div id="toast" role="alert" aria-live="polite"></div>

<script>
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `show ${type}`;
  setTimeout(() => { t.className = ''; }, 3000);
}

async function load() {
  const res = await fetch('/api/staff/zones', { credentials: 'include' });
  if (res.status === 401) { window.location.href = '/staff/login'; return; }
  if (res.status === 403) {
    document.getElementById('zones-grid').innerHTML = '<div class="state-msg">Admin access required.</div>';
    return;
  }
  const { zones } = await res.json();
  render(zones);
}

function render(zones) {
  document.getElementById('zones-grid').innerHTML = zones.map(z => `
    <div class="zone-card ${z.status === 'paused' ? 'paused' : ''}" id="zcard-${z.id}">
      <div class="zone-card-header">
        <div>
          <div class="zone-name">${z.name} <small style="font-size:12px;color:var(--muted)">${z.id}</small></div>
          <div class="zone-crew">${z.crew || ''}</div>
        </div>
        <div class="status-pill ${z.status === 'active' ? 'pill-active' : 'pill-paused'}" id="spill-${z.id}">
          ${z.status === 'active' ? '✓ Active' : '⏸ Paused'}
        </div>
      </div>

      <div class="zone-stats">
        <div class="zone-stat"><div class="num">${z.open_count}</div><div class="lbl">Open</div></div>
      </div>

      ${z.status === 'paused' ? `
        <div class="pause-info">
          ⏸ ${z.pause_reason || 'No reason given'}${z.paused_until ? ` · until ${z.paused_until}` : ''}
        </div>` : ''}

      <div class="zone-actions">
        ${z.status === 'active' ? `
          <label class="sm" for="reason-${z.id}">Pause reason</label>
          <input class="sm" type="text" id="reason-${z.id}" placeholder="e.g. Crew on flood call" />
          <label class="sm" for="until-${z.id}">Paused until</label>
          <input class="sm" type="date" id="until-${z.id}" />
          <div class="btn-row">
            <button class="btn-pause" onclick="pauseZone('${z.id}')">⏸ Pause zone</button>
          </div>
        ` : `
          <div class="btn-row">
            <button class="btn-unpause" onclick="unpauseZone('${z.id}')">▶ Unpause zone</button>
          </div>
        `}
      </div>
    </div>
  `).join('');
}

async function pauseZone(id) {
  const reason = document.getElementById(`reason-${id}`).value.trim();
  const until  = document.getElementById(`until-${id}`).value;
  const res = await fetch(`/api/staff/zones/${id}`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'paused', pause_reason: reason || null, paused_until: until || null }),
  });
  if (res.ok) { toast('⏸ Zone paused.'); load(); }
  else toast('Failed to pause zone.', 'err');
}

async function unpauseZone(id) {
  const res = await fetch(`/api/staff/zones/${id}`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'active', pause_reason: null, paused_until: null }),
  });
  if (res.ok) { toast('▶ Zone activated.'); load(); }
  else toast('Failed.', 'err');
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/staff/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/staff/login';
});

load();
</script>
</body>
</html>
